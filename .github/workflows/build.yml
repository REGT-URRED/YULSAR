name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ponytail: build first — generates packages/*/dist that type-check imports
      - name: Build extension
        run: pnpm build

      - name: Type check
        run: pnpm type-check

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: yulsar-dist
          path: dist
          if-no-files-found: error
